[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dguezm93-automation-starter"
version = "0.1.0"
description = "Reusable Python CLI foundation with streaming file checksums."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "dguezm93"}]
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.17.0"]

[project.scripts]
automation-starter = "automation_starter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
